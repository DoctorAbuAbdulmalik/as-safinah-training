<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>As Safinah Management Training Centre</title>
  <meta name="description" content="As Safinah Management Training Centre — the free online companion to the courses taught at the As Safinah Centre for Humanitarian Excellence, Aqrabat. English, Arabic and Turkish.">
  <meta name="theme-color" content="#1b2a4a">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // apply the saved page theme before first paint
    try { var th = JSON.parse(localStorage.getItem("safinah.theme")); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Oswald:wght@500&family=Spectral:ital,wght@0,400;0,600;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main" id="skip-link">Skip to content</a>

  <header class="bridge">
    <div class="wrap bridge-inner">
      <a class="brand" href="#/" id="brand">
        <span class="ship-disc" aria-hidden="true"><img src="assets/logo-ship.webp" alt="" width="40" height="40"></span>
        <span class="brand-text"><b id="brand-name">As Safinah</b><small id="brand-sub">Management Training Centre</small></span>
      </a>
      <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="decks"></button>
      <nav class="decks" id="decks" aria-label="Main">
        <a href="#/" data-nav="home" id="nav-main"></a>
        <a href="#/programmes" data-nav="programmes" id="nav-programmes"></a>
        <a href="#/voyage" data-nav="voyage" id="nav-voyage"></a>
        <a href="#/about" data-nav="about" id="nav-about"></a>
        <a href="#/key" data-nav="key" id="nav-key"></a>
        <button type="button" class="theme-btn theme-in-menu" data-theme-toggle></button>
      </nav>
      <div class="bridge-tools">
        <div class="lang-plate" id="lang-plate" role="group"></div>
        <button type="button" class="theme-btn" id="sound-btn" aria-pressed="true"></button>
        <button type="button" class="theme-btn" id="theme-btn" data-theme-toggle></button>
      </div>
    </div>
    <div class="wave-wrap" id="wave-top"></div>
  </header>

  <main id="main" class="wrap" tabindex="-1"></main>

  <footer class="harbour-wall">
    <div class="wave-wrap" id="wave-bottom"></div>
    <div class="wrap">
      <div class="part-of">
        <div class="part-of-text" id="part-of"></div>
        <nav class="part-of-links" id="part-of-links" aria-label="As Safinah Centre"></nav>
      </div>
      <p class="fine"><span id="copyright"></span> · <a href="#/key" id="footer-key"></a> · <button type="button" id="reset-progress" class="link-btn"></button></p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
