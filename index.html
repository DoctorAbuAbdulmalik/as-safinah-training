<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>As Safinah Learning</title>
  <meta name="description" content="Digital learning platform of the As Safinah Centre for Humanitarian Excellence — English, Arabic and Turkish.">
  <meta name="theme-color" content="#0b4f6c">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

        <select id="lang-select" aria-labelledby="lang-label"></select>

  <main id="main" class="wrap" tabindex="-1"></main>

      <p id="footer-text"></p>
      <p><button type="button" id="reset-progress" class="link-btn"></button></p>
